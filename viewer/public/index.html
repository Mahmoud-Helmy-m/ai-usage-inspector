<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI Usage Inspector · Dashboard</title>
<script>try{var t=localStorage.getItem("aiui-theme")||localStorage.getItem("cu-theme")||(window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches?"light":"dark");document.documentElement.setAttribute("data-theme",t);}catch(e){document.documentElement.setAttribute("data-theme","dark");}</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<div class="grain" aria-hidden="true"></div>

<header class="topbar">
  <div class="brand">
    <span class="dot"></span>
    <h1>AI&nbsp;USAGE<em>inspector</em></h1>
    <span id="proj" class="proj"></span>
  </div>
  <div class="topmeta">
    <span id="meta-range" class="mono muted">—</span>
    <button id="settings" class="btn icon" title="Tracking &amp; data settings" aria-label="Settings">⚙</button>
    <button id="theme" class="btn icon" title="Toggle light / dark" aria-label="Toggle theme">◐</button>
    <button id="refresh" class="btn" title="Sync new turns and prices, then reload">↻ refresh</button>
  </div>
</header>

<section class="stats" id="stats"></section>

<section class="charts" id="charts" aria-label="Usage charts"></section>

<section class="controls" id="controls">
  <div class="ctl search">
    <input id="f-search" type="search" aria-label="Search turns, sessions and agents" placeholder="search turns, sessions, agents…" />
  </div>
  <label class="ctl"><span>provider</span><select id="f-provider"></select></label>
  <label class="ctl" id="ctl-platform"><span>platform</span><select id="f-platform"></select></label>
  <label class="ctl"><span>workspace</span><select id="f-workspace"></select></label>
  <label class="ctl"><span>model</span><select id="f-model"></select></label>
  <label class="ctl" id="ctl-vendor"><span>vendor</span><select id="f-vendor"></select></label>
  <label class="ctl"><span>mode</span><select id="f-mode"></select></label>
  <label class="ctl" id="ctl-effort"><span>effort</span><select id="f-effort"></select></label>
  <label class="ctl"><span>since</span><input id="f-since" type="date" /></label>
  <label class="ctl"><span>until</span><input id="f-until" type="date" /></label>
  <label class="ctl" id="ctl-ctx"><span>min context %</span><input id="f-ctx" type="range" min="0" max="100" value="0" /><b id="f-ctx-v" class="mono">0</b></label>
  <label class="ctl chk"><input id="f-group" type="checkbox" checked /><span>group by session</span></label>
  <button id="f-clear" class="btn ghost">clear</button>
  <button id="f-csv" class="btn ghost" title="Download the shown prompts as CSV">↓ csv</button>
  <button id="f-json" class="btn ghost" title="Download the shown prompts as JSON">↓ json</button>
  <button id="f-del" class="btn danger" title="Permanently delete the prompts currently shown">delete shown</button>
</section>

<div id="toast" class="toast" hidden></div>

<section class="tablewrap">
  <table class="grid" id="grid">
    <thead>
      <tr>
        <th data-sort="ts" class="sortable col-when">when</th>
        <th data-sort="provider" class="sortable col-provider">provider</th>
        <th data-sort="workspace" class="sortable col-workspace">workspace</th>
        <th data-sort="model" class="sortable col-model">model</th>
        <th data-sort="permissionMode" class="sortable col-mode">mode</th>
        <th data-sort="_in" class="sortable num col-in">in</th>
        <th data-sort="_out" class="sortable num col-out">out</th>
        <th data-sort="contextFillPct" class="sortable num col-context">context</th>
        <th data-sort="_cost" class="sortable num col-cost">cost</th>
        <th class="grow col-prompt">prompt</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <div id="empty" class="empty" hidden>No prompts recorded yet. Start a supported agent session with the hook installed.</div>
</section>

<div id="drawer" class="drawer" hidden>
  <div class="drawer-scrim" data-close></div>
  <aside class="drawer-panel" id="drawer-panel"></aside>
</div>

<div id="settings-drawer" class="drawer" hidden>
  <div class="drawer-scrim" data-settings-close></div>
  <aside class="drawer-panel" id="settings-panel"></aside>
</div>

<script src="/app.js"></script>
</body>
</html>
